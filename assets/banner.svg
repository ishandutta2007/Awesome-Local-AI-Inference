<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .pill-label {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Grid Layer -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Animated Glowing Mesh Orbs (Behind everything) -->
  <g opacity="0.35">
    <!-- Blue Orb Left -->
    <circle cx="180" cy="140" r="140" fill="#0284c7" filter="url(#glow)">
      <animate attributeName="cy" values="140;220;140" dur="10s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;170;140" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite" />
    </circle>
    <!-- Violet Orb Right -->
    <circle cx="1020" cy="240" r="150" fill="#7c3aed" filter="url(#glow)">
      <animate attributeName="cy" values="240;150;240" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1020;960;1020" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="9s" repeatCount="indefinite" />
    </circle>
    <!-- Cyan Orb Center -->
    <circle cx="600" cy="340" r="130" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="cx" values="600;660;540;600" dur="14s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Animated Circuit / Flow Particles in Background -->
  <g opacity="0.35" stroke-linecap="round">
    <!-- Horizontal Flow Lines -->
    <path d="M 50 80 Q 300 120 600 70 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" values="0;-200" dur="15s" repeatCount="indefinite" />
    </path>
    <path d="M 50 350 Q 400 310 800 360 T 1150 330" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;240" dur="18s" repeatCount="indefinite" />
    </path>
    <path d="M 100 200 C 350 280 850 120 1100 210" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="20s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Pulse Nodes in Background -->
  <g fill="#38bdf8">
    <circle cx="280" cy="100" r="3">
      <animate attributeName="r" values="2;5;2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="115" r="3.5">
      <animate attributeName="r" values="3.5;6;3.5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="340" r="3">
      <animate attributeName="r" values="2;5.5;2" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="345" r="3.5">
      <animate attributeName="r" values="3.5;6;3.5" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND LAYER: Clear, Readable Text & Badges (Unaffected by animations) -->
  <g id="foreground">
    <!-- Category Pill Tag -->
    <g transform="translate(460, 48)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="4.5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="tagline-text" fill="#94a3b8">ON-DEVICE &amp; SELF-HOSTED</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" class="title-text" fill="url(#textGrad)" filter="url(#softGlow)">
      Awesome Local AI Inference
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text" fill="url(#subTextGrad)">
      Run State-of-the-Art LLMs &amp; Multimodal Models Locally • Zero Cloud Dependency
    </text>

    <!-- Feature Badges / Spec Pills -->
    <g transform="translate(140, 245)">
      <!-- Pill 1: Privacy -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="80" y="26" text-anchor="middle" class="pill-label" fill="#38bdf8">🔒 100% Private</text>
      </g>

      <!-- Pill 2: Hardware -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="90" y="26" text-anchor="middle" class="pill-label" fill="#a5b4fc">⚡ CUDA • Metal • MLX</text>
      </g>

      <!-- Pill 3: OpenAI Compatible -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="200" height="42" rx="21" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="100" y="26" text-anchor="middle" class="pill-label" fill="#d8b4fe">🌐 OpenAI Compatible API</text>
      </g>

      <!-- Pill 4: Zero Token Fees -->
      <g transform="translate(600, 0)">
        <rect x="0" y="0" width="160" height="42" rx="21" fill="url(#pillGrad1)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="80" y="26" text-anchor="middle" class="pill-label" fill="#6ee7b7">💸 Zero Token Costs</text>
      </g>

      <!-- Pill 5: Offline First -->
      <g transform="translate(780, 0)">
        <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#pillGrad1)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="70" y="26" text-anchor="middle" class="pill-label" fill="#f472b6">📶 Air-Gapped</text>
      </g>
    </g>

    <!-- Key Architecture Line at Bottom -->
    <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" letter-spacing="1.2px">
      llama.cpp • Ollama • vLLM • Open WebUI • LocalAI • Jan • LM Studio • Exo • GPT4All
    </text>
  </g>
</svg>
